[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "frozen-siglip2-retrieval"
version = "0.1.0"
description = "Frozen SigLIP 2 text-to-image retrieval with five-crop fusion on Flickr8k"
requires-python = ">=3.9"
dependencies = [
  "gradio>=4.44,<5; python_version < '3.10'",
  "gradio>=5.0,<7; python_version >= '3.10'",
  "huggingface-hub>=0.28,<2",
  "numpy>=1.24,<3",
  "pydantic>=2,<2.11; python_version < '3.10'",
  "pyarrow>=17,<24",
  "pillow>=10,<13",
  "pyyaml>=6,<7",
  "torch>=2.1,<3",
  "transformers>=4.49,<6",
]

[tool.setuptools.packages.find]
where = ["src"]

